name: Daban Intraday Push (打板盘中推送)

on:
  schedule:
    # 每个交易日 14:32 北京时间 (06:32 UTC), 提前吸收 Actions 排队延迟
    - cron: "32 6 * * 1-5"
  workflow_dispatch:  # 支持手动触发

jobs:
  screen-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run daban intraday screen
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python daban_daily.py

      - name: Upload signal
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daban-intraday
          path: daily_reports/
          retention-days: 30
